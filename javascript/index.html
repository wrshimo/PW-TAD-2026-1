<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <title>Minha Loja Virtual</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg bg-dark" data-bs-theme="dark">
            <div class="container">
                <a class="navbar-brand" href="#">Loja do Shimo</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav"
                    aria-controls="nav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="nav">
                    <ul class="nav navbar-nav me-auto">
                        <li class="nav-item"><a class="nav-link active" href="/">Home</a></li>
                        <li class="nav-item"><a class="nav-link" href="/produtos">Produtos</a></li>
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button"
                                data-bs-toggle="dropdown" aria-expanded="false">
                                Categorias
                            </a>
                            <ul class="dropdown-menu" aria-labelledby="navbarDropdown">
                                <li><a class="dropdown-item" href="#">Eletrônicos</a></li>
                                <li><a class="dropdown-item" href="#">Roupas</a></li>
                                <li><a class="dropdown-item" href="#">Livros</a></li>
                                <li><a class="dropdown-item" href="#">Casa e Jardim</a></li>
                            </ul>
                        </li>
                        <li class="nav-item"><a class="nav-link" href="/contato">Contato</a></li>
                    </ul>
                    <form class="d-flex" role="search">
                        <input class="form-control me-2" type="search" placeholder="Buscar" />
                        <button class="btn btn-outline-light" type="submit">Buscar</button>
                    </form>
                    <div class="d-flex ms-3">
                        <a href="#" class="text-white text-decoration-none" id="cart-icon" data-bs-toggle="popover"
                            data-bs-placement="bottom" title="Carrinho" data-bs-content="">
                            <i class="bi bi-cart fs-4"></i>
                            <span id="cart-count"
                                class="badge rounded-pill bg-danger position-absolute translate-middle">0</span>
                        </a>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <div class="container mt-4">
        <div class="row">
            <main class="col-md-12">
                <form id="filter-form" class="mb-4">
                    <div class="row align-items-end">
                        <div class="col-md-3">
                            <label for="price-filter" class="form-label">Preço Máximo</label>
                            <input type="number" class="form-control" id="price-filter" placeholder="Digite o preço">
                        </div>
                        <div class="col-md-auto">
                            <button type="button" id="filter-btn" class="btn btn-primary">Filtrar</button>
                        </div>
                    </div>
                </form>
                <section id="product-list"
                    class="row row-cols-1 row-cols-md-2 row-cols-lg-3 row-cols-xl-4 row-cols-xxl-5 g-4">
                    <!-- Os produtos serão inseridos aqui via JavaScript -->
                </section>
                <hr>
                <section id="cadastro" class="mt-5">
                    <h2>Cadastro</h2>
                    <form id="contact-form">
                        <input type="text" id="nome" placeholder="Nome" class="form-control mb-2">
                        <input type="email" id="email" placeholder="E-mail" class="form-control mb-2">
                        <button type="submit" class="btn btn-success">Enviar</button>
                    </form>
                    <div id="form-message" class="mt-2"></div>
                </section>
            </main>
        </div>
    </div>
    <footer class="bg-dark text-white text-center p-3 mt-4">
        <p>&copy; 2024 Minha Loja Virtual. Todos os direitos reservados.</p>
        <ul class="nav justify-content-center">
            <li class="nav-item"><a href="#" class="nav-link px-2 text-white">Sobre Nós</a></li>
            <li class="nav-item"><a href="#" class="nav-link px-2 text-white">Política de Privacidade</a></li>
            <li class="nav-item"><a href="#" class="nav-link px-2 text-white">Termos de Uso</a></li>
        </ul>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>
</body>

</html>
